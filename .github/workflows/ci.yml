name: native checks

on:
  # Pull requests already run every check on their head; a branch push would
  # start a second, identical run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      webview:
        description: Run optional Windows and Linux system WebView checks (pull requests run them when labelled webview)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Self-hosted Windows x64 runner with PowerShell 7, Python 3 and tar on
    # PATH, running in an interactive desktop session. The repository variable
    # WINDOWS_RUNS_ON overrides the labels with a JSON value, for example
    # '"windows-2022"' to return to a hosted runner.
    #
    # Windows checks are paused while Linux and macOS come first: they run
    # only when the repository variable WINDOWS_CI is 'true'.
    if: vars.WINDOWS_CI == 'true'
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNS_ON || '["self-hosted", "windows", "x64"]') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Debug only; ReleaseSafe runs on main and manual runs.
        optimize: ${{ fromJSON(github.event_name == 'pull_request' && '["Debug"]' || '["Debug", "ReleaseSafe"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use cached Zig 0.17.0 and build caches
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in 'python', 'tar') {
            if (!(Get-Command $tool -ErrorAction SilentlyContinue)) { throw "The Windows runner needs $tool on PATH." }
          }
          $zig = ./scripts/fetch-zig-windows.ps1
          Split-Path -Parent $zig | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ./scripts/ci-zig-cache.ps1 | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Format, compile, unit and native integration checks
        run: |
          Write-Output "zig build jobs: $env:NUMBER_OF_PROCESSORS"
          $hangs = Start-Process pwsh -NoNewWindow -PassThru -ArgumentList '-NoProfile', '-File', 'scripts/ci-hang-report.ps1'
          zig fmt --check build.zig build_support src examples tests tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-native-header-cache.ps1
          zig build "-j$env:NUMBER_OF_PROCESSORS" test check update-tool smoke smoke-lifecycle smoke-window-registry smoke-app-stop smoke-composition smoke-composition-ui smoke-window-state smoke-window-relationships smoke-window-chrome smoke-window-policy smoke-system-extras smoke-system-details smoke-vibrancy smoke-system-session smoke-key-input smoke-pointer-press smoke-pointer-focus smoke-pointer-clicks smoke-pointer-accessibility smoke-drawing smoke-gradients smoke-gradient-analytic smoke-conic-gradients smoke-gradient-interpolation smoke-coverage smoke-layers smoke-offscreen smoke-gaussian smoke-gaussian-scope smoke-document-fields smoke-svg smoke-svg-text smoke-svg-image smoke-text-layout smoke-text-layout-capture smoke-text-words smoke-text-words-fault smoke-text-clusters smoke-text-outlines smoke-text-cells smoke-text-drawing smoke-shaped-editor smoke-shaped-editor-native smoke-editor-caret smoke-editor-line-backgrounds smoke-editor-pre-input smoke-editor-range-markers smoke-text-input-mode smoke-text-client smoke-document smoke-document-editor smoke-code-editor smoke-document-diff-view smoke-virtual-list smoke-images smoke-image-prepare smoke-image-drawing smoke-image-update smoke-diagnostics smoke-waitables smoke-damage smoke-wake smoke-animation-ui smoke-affine-renderer smoke-affine-ui smoke-affine-document smoke-affine-text-binding smoke-affine-document-diff smoke-affine-diff-controls smoke-document-provider smoke-document-point-latch smoke-document-accessibility smoke-document-diff-accessibility smoke-document-geometry smoke-window-placement smoke-snippets smoke-native-reentry smoke-ime-cancel smoke-editor smoke-editor-routing smoke-packaging smoke-ui-config smoke-system smoke-system-events smoke-system-menus smoke-shell smoke-file-watch smoke-clipboard smoke-drop smoke-desktop smoke-widgets smoke-widget-ranges smoke-theme smoke-backdrop smoke-shader-effects smoke-view smoke-view-text smoke-automation smoke-chart smoke-terminal smoke-view-pickers smoke-view-collections smoke-picker smoke-picker-result smoke-secrets smoke-flyout smoke-now-playing-commands smoke-os-integration smoke-cleanup smoke-audio -Daccessibility=true -Doptimize=${{ matrix.optimize }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Real mouse input moves the one desktop cursor: no other smoke runs beside it.
          zig build smoke-drag -Daccessibility=true -Doptimize=${{ matrix.optimize }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build "-j$env:NUMBER_OF_PROCESSORS" smoke-accessibility -Daccessibility=true -Doptimize=${{ matrix.optimize }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build "-j$env:NUMBER_OF_PROCESSORS" smoke-language-protocol smoke-language-protocol-shutdown smoke-completion-resolve smoke-completion-details smoke-diff-caret smoke-diff-commands smoke-diff-find -Doptimize=${{ matrix.optimize }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build "-j$env:NUMBER_OF_PROCESSORS" smoke-shortcut-scopes smoke-accessibility-host -Daccessibility=true -Doptimize=${{ matrix.optimize }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Stop-Process -Id $hangs.Id -ErrorAction SilentlyContinue
      - name: Packaging and real Authenticode test certificate checks
        run: |
          $license = Join-Path $env:GITHUB_WORKSPACE 'LICENSE'
          ./tests/packaging.ps1 -ExecutablePath ./zig-out/bin/smoke-packaging.exe -LicensePath $license
          ./tests/signing.ps1 -ExecutablePath ./zig-out/bin/smoke-packaging.exe -LicensePath $license
          ./tests/update_package_smoke.ps1
          zig build "-j$env:NUMBER_OF_PROCESSORS" build-setup-smoke -Doptimize=${{ matrix.optimize }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/setup_smoke.ps1
      - name: Direct3D 11 shader effects on WARP
        run: |
          zig build "-j$env:NUMBER_OF_PROCESSORS" smoke-shader-effects-gpu -Dgpu=true -Doptimize=${{ matrix.optimize }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Optional pinned WebP decoder
        run: |
          ./scripts/fetch-webp.ps1
          zig build "-j$env:NUMBER_OF_PROCESSORS" smoke-images -Dwebp=true -Doptimize=${{ matrix.optimize }}
      - name: Optional pinned SQLite amalgamation
        run: |
          python scripts/fetch-sqlite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build "-j$env:NUMBER_OF_PROCESSORS" test-sqlite -Doptimize=${{ matrix.optimize }}
      - name: Application font registration
        run: |
          zig build "-j$env:NUMBER_OF_PROCESSORS" smoke-fonts -Doptimize=${{ matrix.optimize }}
      # Hardware GPU coverage is a separate local driver check. Hosted runner
      # measurements below explicitly record any GPU fallback and deferred work.
      - name: Capture reproducible benchmark evidence
        if: matrix.optimize == 'ReleaseSafe'
        run: ./scripts/benchmark.ps1 -Renderer gdi,warp -Repetitions 1 -OutputDirectory ./zig-out/ci-benchmarks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.optimize == 'ReleaseSafe'
        with:
          name: windows-benchmark-evidence
          path: zig-out/ci-benchmarks/*.json
          if-no-files-found: error
          retention-days: 7

  linux:
    # Self-hosted Linux runner (Debian/Ubuntu with apt). The repository variable
    # LINUX_RUNS_ON overrides the labels with a JSON value, for example
    # '"ubuntu-24.04"' to return to a hosted runner.
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Debug only; ReleaseSafe runs on main and manual runs.
        optimize: ${{ fromJSON(github.event_name == 'pull_request' && '["Debug"]' || '["Debug", "ReleaseSafe"]') }}
    env:
      # Each job adds several GB to the shared Zig caches and the script wipes
      # them whole once they pass the cap, so a small cap made most jobs start
      # cold. The runner keeps them on its 60 GB data disk; the free space
      # floor in scripts/ci-zig-cache.sh still applies.
      ZIGGURAT_CI_CACHE_MAX_MB: 40960
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native GTK/Pango dependencies
        run: |
          sh scripts/ci-linux-deps.sh ca-certificates curl xz-utils python3 libgtk-3-dev libpango1.0-dev libicu-dev pkg-config xvfb xauth openbox x11-utils libxtst6 libatspi2.0-dev at-spi2-core dbus dbus-x11 shared-mime-info fonts-dejavu-core fonts-noto-cjk libepoxy-dev libegl-dev libgl1-mesa-dri
      - name: Use cached Zig 0.17.0 and build caches
        run: |
          zig_bin=$(sh scripts/fetch-zig.sh)
          printf '%s\n' "$(dirname "$zig_bin")" >> "$GITHUB_PATH"
          printf 'ZIG_BIN=%s\n' "$zig_bin" >> "$GITHUB_ENV"
          sh scripts/ci-zig-cache.sh >> "$GITHUB_ENV"
      - name: Format, compile, unit and native integration checks
        env:
          G_DEBUG: fatal-criticals
          GDK_BACKEND: x11
        run: |
          zig fmt --check build.zig build_support src examples tests tools
          bash scripts/test-native-header-cache.sh
          zig build test check -Doptimize=${{ matrix.optimize }}
          zig build smoke-audio -Doptimize=${{ matrix.optimize }}
          zig build smoke-webview-runtime-linux -Doptimize=${{ matrix.optimize }}
          zig build test-document-word-units -Doptimize=${{ matrix.optimize }}
          zig build test-shader-gl -Doptimize=${{ matrix.optimize }}
          bash scripts/net-tls-probe.sh -Doptimize=${{ matrix.optimize }}
          NO_AT_BRIDGE=1 xvfb-run -a -s '-screen 0 1280x800x24' zig build test-linux-accessibility-host test-linux-accessibility-position smoke-accessibility-host smoke-shortcut-scopes test-document-accessibility-linux-owner smoke-document-accessibility-linux -Doptimize=${{ matrix.optimize }}
          GDK_SCALE=2 NO_AT_BRIDGE=1 xvfb-run -a -s '-screen 0 1280x800x24' zig build test-linux-accessibility-host test-linux-accessibility-position smoke-accessibility-host smoke-shortcut-scopes test-document-accessibility-linux-owner smoke-document-accessibility-linux -Doptimize=${{ matrix.optimize }}
          GDK_SCALE=2 bash scripts/document-accessibility-atspi.sh -Doptimize=${{ matrix.optimize }}
          bash scripts/test-profile-storage.sh -Doptimize=${{ matrix.optimize }}
          xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-language-protocol smoke-language-protocol-shutdown smoke-completion-resolve smoke-completion-details smoke-diff-caret smoke-diff-commands smoke-diff-find -Doptimize=${{ matrix.optimize }}
          xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-text-layout smoke-text-layout-capture smoke-text-words smoke-text-words-fault smoke-text-clusters smoke-text-outlines smoke-text-cells smoke-text-drawing smoke-shaped-editor smoke-images smoke-image-prepare smoke-image-drawing smoke-image-update smoke-shell smoke-file-watch smoke-clipboard smoke-drop smoke-desktop -Doptimize=${{ matrix.optimize }}
          xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-linux smoke-linux-touch test-linux-touch smoke-window-policy smoke-system-extras smoke-system-details smoke-vibrancy smoke-system-session smoke-system-menus test-pointer-gtk smoke-pointer-core-linux smoke-pointer-clicks smoke-content-host smoke-damage smoke-wake smoke-animation-ui smoke-window-registry smoke-app-stop smoke-composition smoke-composition-ui smoke-key-input smoke-widgets smoke-widget-ranges smoke-theme smoke-backdrop smoke-shader-effects smoke-shader-effects-gl smoke-view smoke-view-text smoke-automation smoke-chart smoke-terminal smoke-view-pickers smoke-view-collections smoke-affine-renderer smoke-affine-ui smoke-affine-document smoke-affine-text-binding smoke-affine-document-diff smoke-document-geometry smoke-snippets smoke-drawing smoke-gradients smoke-gradient-analytic smoke-conic-gradients smoke-gradient-interpolation smoke-coverage smoke-layers smoke-offscreen smoke-gaussian smoke-gaussian-scope smoke-document-fields smoke-svg smoke-svg-text smoke-svg-image smoke-shaped-editor-native smoke-editor-caret smoke-editor-line-backgrounds smoke-editor-pre-input smoke-editor-range-markers smoke-text-input-mode smoke-text-client smoke-document smoke-document-editor smoke-code-editor smoke-document-diff-view smoke-virtual-list smoke-desktop smoke-flyout smoke-now-playing-commands -Doptimize=${{ matrix.optimize }}
          xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-drag -Doptimize=${{ matrix.optimize }}
          GDK_SCALE=2 xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-linux smoke-system-menus test-pointer-gtk smoke-pointer-core-linux smoke-pointer-clicks smoke-content-host smoke-damage smoke-wake smoke-animation-ui smoke-window-registry smoke-app-stop smoke-composition smoke-composition-ui smoke-key-input smoke-widgets smoke-widget-ranges smoke-theme smoke-backdrop smoke-shader-effects smoke-shader-effects-gl smoke-view smoke-view-text smoke-automation smoke-chart smoke-terminal smoke-view-pickers smoke-view-collections smoke-affine-renderer smoke-affine-ui smoke-affine-document smoke-affine-text-binding smoke-affine-document-diff smoke-document-geometry smoke-snippets smoke-drawing smoke-gradients smoke-gradient-analytic smoke-conic-gradients smoke-gradient-interpolation smoke-coverage smoke-layers smoke-offscreen smoke-gaussian smoke-gaussian-scope smoke-document-fields smoke-svg smoke-svg-text smoke-svg-image smoke-shaped-editor-native smoke-editor-caret smoke-editor-line-backgrounds smoke-editor-pre-input smoke-editor-range-markers smoke-text-input-mode smoke-text-client smoke-document smoke-document-editor smoke-code-editor smoke-document-diff-view smoke-virtual-list smoke-desktop smoke-flyout smoke-now-playing-commands -Doptimize=${{ matrix.optimize }}
          XDG_RUNTIME_DIR=$(mktemp -d) NO_AT_BRIDGE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-system-desktop -Doptimize=${{ matrix.optimize }}
          GDK_SCALE=2 XDG_RUNTIME_DIR=$(mktemp -d) NO_AT_BRIDGE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-system-desktop -Doptimize=${{ matrix.optimize }}
          XDG_RUNTIME_DIR=$(mktemp -d) NO_AT_BRIDGE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-now-playing -Doptimize=${{ matrix.optimize }}
          # A runner with GNOME Keyring round-trips real secrets in a fresh
          # keyring; one without a Secret Service must report
          # CredentialStoreUnavailable everywhere.
          XDG_DATA_HOME=$(mktemp -d) XDG_RUNTIME_DIR=$(mktemp -d) NO_AT_BRIDGE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' sh -c 'if command -v gnome-keyring-daemon >/dev/null; then printf ziggurat | gnome-keyring-daemon --unlock --components=secrets >/dev/null && exec zig build smoke-secrets -Doptimize=${{ matrix.optimize }} -- --require-store; fi; exec zig build smoke-secrets -Doptimize=${{ matrix.optimize }}'
          bash scripts/linux-window-state.sh -Doptimize=${{ matrix.optimize }}
          GDK_SCALE=2 bash scripts/linux-window-state.sh -Doptimize=${{ matrix.optimize }}
          # Private session bus doubles as the system bus for the logind stand-in.
          XDG_RUNTIME_DIR=$(mktemp -d) xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh -c 'DBUS_SYSTEM_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS zig build smoke-os-integration -Doptimize=${{ matrix.optimize }} -- --require-dbus'
      - name: Setup program, launcher and Debian package checks
        run: |
          zig build build-setup-smoke -Doptimize=${{ matrix.optimize }}
          sh tests/setup_smoke.sh
      - name: Optional pinned WebP decoder
        run: |
          sh scripts/fetch-webp.sh
          zig build smoke-images -Dwebp=true -Doptimize=${{ matrix.optimize }}
      - name: Optional pinned SQLite amalgamation
        run: |
          python3 scripts/fetch-sqlite.py
          zig build test-sqlite -Doptimize=${{ matrix.optimize }}
      - name: Application font registration
        run: |
          XDG_CACHE_HOME=$(mktemp -d) zig build smoke-fonts -Doptimize=${{ matrix.optimize }}
      - name: Optional WebKitGTK lifecycle and policy checks
        if: github.event_name == 'workflow_dispatch' && inputs.webview
        run: |
          sh scripts/ci-linux-deps.sh libwebkit2gtk-4.1-dev glib-networking dbus-x11 libcurl4-openssl-dev
          export ZIG_BIN="$(command -v zig)"
          export P01_OPTIMIZE=${{ matrix.optimize }}
          zig build test-https-resources -Dhttps-resources=true -Doptimize=${{ matrix.optimize }}
          bash scripts/https-resources-probe.sh -Doptimize=${{ matrix.optimize }}
          GDK_SCALE=2 bash scripts/https-resources-probe.sh -Doptimize=${{ matrix.optimize }}
          bash scripts/https-resources-probe.sh --native -Doptimize=${{ matrix.optimize }}
          P01_PROBE=zig-test bash scripts/webkit-probe.sh
          zig build test-webkit-file -Dwebview=true -Doptimize=${{ matrix.optimize }}
          P01_PROBE=profile-owner bash scripts/webkit-probe.sh
          P01_PROBE=profile-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=profile-zig bash scripts/webkit-probe.sh
          P01_PROBE=cookies-owner bash scripts/webkit-probe.sh
          P01_PROBE=cookies-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=cookies-zig bash scripts/webkit-probe.sh
          P01_OPTIMIZE=${{ matrix.optimize }} P01_PROBE=find-owner bash scripts/webkit-probe.sh
          P01_OPTIMIZE=${{ matrix.optimize }} bash scripts/webkit-find-probe.sh all
          P01_PROBE=capture-owner bash scripts/webkit-probe.sh
          P01_PROBE=capture-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=capture-zig bash scripts/webkit-probe.sh
          P01_PROBE=initializers-owner bash scripts/webkit-probe.sh
          P01_PROBE=initializers-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=initializers-zig bash scripts/webkit-probe.sh
          P01_PROBE=profile-tls-owner bash scripts/webkit-probe.sh
          P01_PROBE=https-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=https-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=https-pages-zig bash scripts/webkit-probe.sh
          P01_PROBE=contract bash scripts/webkit-probe.sh
          P01_PROBE=backend bash scripts/webkit-probe.sh
          P01_PROBE=local-test bash scripts/webkit-probe.sh
          P01_PROBE=local bash scripts/webkit-probe.sh
          P01_REQUEST_PROBE=remote-test bash scripts/webkit-request-probe.sh
          P01_REQUEST_PROBE=strict bash scripts/webkit-request-probe.sh
          P01_PROBE=remote bash scripts/webkit-probe.sh
          P01_PROBE=remote-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=remote-zig bash scripts/webkit-probe.sh
          P01_PROBE=zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=zig bash scripts/webkit-probe.sh
          P01_PROBE=dynamic-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=dynamic-zig bash scripts/webkit-probe.sh
          P01_PROBE=navigation-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=navigation-zig bash scripts/webkit-probe.sh
          P01_CONTENT=regions bash scripts/linux-content-probe.sh
          P01_PROBE=regions-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=regions-zig bash scripts/webkit-probe.sh
          P01_PROBE=session-host bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=session-host bash scripts/webkit-probe.sh
          P01_PROBE=session-zig bash scripts/webkit-probe.sh
          GDK_SCALE=2 P01_PROBE=session-zig bash scripts/webkit-probe.sh
          P01_PROBE=page-facts-zig bash scripts/webkit-probe.sh
          P01_PROBE=http-auth-zig bash scripts/webkit-probe.sh
          P01_PROBE=context-menu-zig bash scripts/webkit-probe.sh
          P01_PROBE=page-options-zig bash scripts/webkit-probe.sh
          P01_PROBE=session-state-zig bash scripts/webkit-probe.sh
      - name: WebKitGTK content rules and audio
        if: (github.event_name == 'workflow_dispatch' && inputs.webview) || contains(github.event.pull_request.labels.*.name, 'webview')
        run: |
          sh scripts/ci-linux-deps.sh libwebkit2gtk-4.1-dev glib-networking dbus-x11
          xvfb-run -a -s '-screen 0 1280x800x24' zig build smoke-webview-content-rules -Dwebview=true -Doptimize=${{ matrix.optimize }}
      - name: Capture Cairo submission and idle evidence
        if: matrix.optimize == 'ReleaseSafe'
        run: |
          mkdir -p zig-out/ci-benchmarks
          xvfb-run -a -s '-screen 0 1280x800x24' zig build benchmark -Doptimize=ReleaseFast -- --output zig-out/ci-benchmarks/linux.json
          sha256sum zig-out/bin/benchmark > zig-out/ci-benchmarks/benchmark.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.optimize == 'ReleaseSafe'
        with:
          name: linux-benchmark-evidence
          path: zig-out/ci-benchmarks/*
          if-no-files-found: error
          retention-days: 7

  linux-release-tests:
    # Unit tests built ReleaseSafe on every pull request. Zig 0.17.0 has
    # optimizer-only miscompiles (see zio.asUnsigned) that Debug runs miss,
    # and main publishes ReleaseSafe builds.
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 75
    env:
      # See the linux job.
      ZIGGURAT_CI_CACHE_MAX_MB: 40960
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native GTK/Pango dependencies
        run: |
          sh scripts/ci-linux-deps.sh ca-certificates curl xz-utils python3 libgtk-3-dev libpango1.0-dev libicu-dev pkg-config xvfb xauth openbox x11-utils libxtst6 libatspi2.0-dev at-spi2-core dbus dbus-x11 shared-mime-info fonts-dejavu-core fonts-noto-cjk libepoxy-dev libegl-dev libgl1-mesa-dri
      - name: Use cached Zig 0.17.0 and build caches
        run: |
          zig_bin=$(sh scripts/fetch-zig.sh)
          printf '%s\n' "$(dirname "$zig_bin")" >> "$GITHUB_PATH"
          sh scripts/ci-zig-cache.sh >> "$GITHUB_ENV"
      - name: ReleaseSafe unit tests
        env:
          G_DEBUG: fatal-criticals
          GDK_BACKEND: x11
        run: zig build test -Doptimize=ReleaseSafe

  macos:
    # Self-hosted macOS runner with the Xcode command line tools, which give
    # Zig the SDK. The repository variable MACOS_RUNS_ON overrides the labels
    # with a JSON value, for example '"macos-15"' for a hosted runner.
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '["self-hosted", "macOS"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Debug only; ReleaseSafe runs on main and manual runs.
        optimize: ${{ fromJSON(github.event_name == 'pull_request' && '["Debug"]' || '["Debug", "ReleaseSafe"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use cached Zig 0.17.0 and build caches
        run: |
          xcrun --sdk macosx --show-sdk-path
          zig_bin=$(sh scripts/fetch-zig.sh)
          printf '%s\n' "$(dirname "$zig_bin")" >> "$GITHUB_PATH"
          sh scripts/ci-zig-cache.sh >> "$GITHUB_ENV"
      - name: Unit tests and compile everything for macOS
        timeout-minutes: 30
        run: |
          zig build test check --test-timeout 5m -Doptimize=${{ matrix.optimize }} --summary failures
      - name: AppKit window and file-watch smokes
        timeout-minutes: 10
        run: |
          zig build smoke-macos smoke-file-watch smoke-macos-services -Doptimize=${{ matrix.optimize }} --summary failures
      - name: WKWebView compile and page smokes
        timeout-minutes: 15
        run: |
          zig build check -Dwebview=true -Doptimize=${{ matrix.optimize }} --summary failures
          zig build build-smoke-webview-macos build-smoke-webview-content-rules build-smoke-webview-local-macos build-smoke-webview-remote-macos -Dwebview=true -Doptimize=${{ matrix.optimize }} --summary failures
          sh scripts/macos-symbolize.sh zig-out/bin/smoke-webview-macos
          sh scripts/macos-symbolize.sh zig-out/bin/smoke-webview-content-rules
          sh scripts/macos-symbolize.sh zig-out/bin/smoke-webview-local-macos
          sh scripts/macos-symbolize.sh zig-out/bin/smoke-webview-remote-macos

  webview:
    # Paused with the Windows job; see WINDOWS_CI there.
    if: vars.WINDOWS_CI == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.webview) || contains(github.event.pull_request.labels.*.name, 'webview'))
    # Also needs Node.js and an installed WebView2 Runtime on the runner.
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNS_ON || '["self-hosted", "windows", "x64"]') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use cached Zig 0.17.0, build caches and SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $zig = ./scripts/fetch-zig-windows.ps1
          Split-Path -Parent $zig | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ./scripts/ci-zig-cache.ps1 | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./scripts/fetch-webview2.ps1
      - name: Install verified Bun 1.3.5
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bun-1.3.5.zip'
          Invoke-WebRequest 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-windows-x64-baseline.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine 'bf447dcc3b06aba9b9706a9db46fcd65e06a4d47d31439922313825d06eb47ca') { throw 'Bun archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP 'bun-windows-x64-baseline'
          if ((& (Join-Path $bin 'bun.exe') --version) -cne '1.3.5') { throw 'Wrong Bun version.' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Python for the isolated HTTPS wire oracle
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Real WebView2 Runtime lifecycle and policy checks
        run: |
          bun test tests/ipc_client.test.ts tests/ipc_events.test.ts tests/resource_stream_client.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # These fail when the system Runtime is unavailable; no Runtime is downloaded.
          zig build "-j$env:NUMBER_OF_PROCESSORS" test test-remote-origin smoke-webview smoke-composition-webview smoke-page-host smoke-page-session smoke-webview-policy smoke-page smoke-page-remote smoke-page-authorization smoke-script smoke-browser-tools smoke-request-policy smoke-resource-async smoke-resource-file smoke-scheme smoke-resource-producer smoke-permission smoke-download smoke-browser-policy smoke-ipc smoke-assets smoke-page-runtime smoke-plugin-fetch smoke-plugin-watch smoke-plugin-sqlite smoke-plugin-websocket smoke-embedded-webview smoke-webview-content-rules smoke-webview-page-facts smoke-webview-http-auth smoke-webview-context-menu smoke-webview-page-options smoke-webview-session-state smoke-webview-picture-in-picture -Dwebview=true -Doptimize=ReleaseSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone engine discovery without a page
        run: |
          zig build "-j$env:NUMBER_OF_PROCESSORS" test-webview-runtime build-smoke-webview-runtime -Doptimize=ReleaseSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $loader = (Resolve-Path -LiteralPath '.deps/webview2/build/native/x64/WebView2Loader.dll').Path
          ./zig-out/bin/smoke-webview-runtime.exe $loader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact-origin HTTPS credential lifecycle and redirect checks
        run: |
          zig build "-j$env:NUMBER_OF_PROCESSORS" build-smoke-request-credentials -Dwebview=true -Doptimize=ReleaseSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/windows_https_credentials_host.py --exe zig-out/bin/smoke-request-credentials.exe --cache .zig-cache/managed/windows-credentials-ci --log .validation/ci/windows-credentials.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Document-start initializer lifecycle and wire checks
        run: |
          zig build "-j$env:NUMBER_OF_PROCESSORS" test-document-initializers test-document-initializers-native build-initializer-semantics-emitter build-smoke-document-initializers -Dwebview=true -Doptimize=ReleaseSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/document_initializers_semantics.mjs zig-out/bin/initializer-semantics-source.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/windows_https_initializers_host.py --exe zig-out/bin/smoke-document-initializers.exe --cache .zig-cache/managed/windows-initializers-ci --log .validation/ci/windows-initializers.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-page-wire-evidence
          path: .validation/ci/*.json
          if-no-files-found: ignore
          retention-days: 7

  macos-packaging:
    # Self-hosted macOS runner with the Xcode command line tools. The
    # repository variable MACOS_RUNS_ON overrides the labels with a JSON
    # value, for example '"macos-15"' to use a hosted runner.
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '["self-hosted", "macOS"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use cached Zig 0.17.0 and build caches
        run: |
          zig_bin=$(sh scripts/fetch-zig.sh)
          printf '%s\n' "$(dirname "$zig_bin")" >> "$GITHUB_PATH"
          sh scripts/ci-zig-cache.sh >> "$GITHUB_ENV"
      - name: Link AppKit from the native SDK
        run: |
          sw_vers
          xcrun --sdk macosx --show-sdk-path
          zig version
          zig build-exe tests/macos_sdk_probe.zig -lc -lobjc -framework AppKit -femit-bin="$RUNNER_TEMP/macos-sdk-probe"
          "$RUNNER_TEMP/macos-sdk-probe"
      - name: CLI tests, then a universal app, its signature, disk image and install script
        run: |
          zig build cli test-cli
          sh tests/macos_packaging.sh
