<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'none'; connect-src 'none'">
<title>Ziggurat counter</title>
<style>
  body { margin: 32px; color: #182430; background: #f8f7f3; font: 16px 'Segoe UI', sans-serif }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 32px }
  button { font: inherit; padding: 10px 24px; margin-top: 16px }
  button:focus-visible { outline: 2px solid #274c77; outline-offset: 3px }
</style>
<h1>Ziggurat / System WebView</h1>
<p>Count: <output id="count">0</output></p>
<button id="increment">Increment in Zig</button>
<p>The counter state belongs to Zig. This page has no network access.</p>
<script>
  window.chrome.webview.addEventListener('message', event => {
    document.getElementById('count').textContent = event.data;
  });
  document.getElementById('increment').addEventListener('click', () => {
    window.chrome.webview.postMessage('increment');
  });
</script>
</html>
